[pytest]
# Default run excludes tests that need live credentials or a running Redis, so
# `pytest` is green on a fresh clone with nothing configured. That is the first
# command a new contributor runs; it must not fail for reasons they did not cause.
#
# To run the excluded ones (needs GOOGLE_API_KEY and a reachable Redis):
#     pytest -m integration
#
# They skip themselves rather than fail when the prerequisites are absent, so
# the opt-in path degrades honestly instead of erroring.
addopts = -m "not integration"

markers =
    integration: needs live credentials and/or a running Redis. Excluded by default.

asyncio_mode = strict
testpaths = tests

# Put the repo root on sys.path so `core`, `gateway`, `cache`, `providers`, and
# `routing` import from a plain `pytest` invocation.
#
# Without this, bare `pytest` fails at tests/conftest.py with
# "ModuleNotFoundError: No module named 'core'". It appeared to work only because
# `python -m pytest` silently prepends the current directory, which `pytest` does
# not. There is no root-level conftest.py and `tests/` has no `__init__.py`, so
# pytest's prepend import mode inserts `tests/` rather than the repo root.
#
# This was broken before pytest.ini existed; CI caught it on its first run, and
# README.md had been telling people to run `pytest` the whole time.
pythonpath = .
