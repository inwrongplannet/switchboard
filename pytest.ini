[pytest]
# Default run excludes tests that need live credentials or a running Redis, so
# `pytest` is green on a fresh clone with nothing configured. That is the first
# command a new contributor runs; it must not fail for reasons they did not cause.
#
# To run the excluded ones (needs GOOGLE_API_KEY and a reachable Redis):
#     pytest -m integration
#
# They skip themselves rather than fail when the prerequisites are absent, so
# the opt-in path degrades honestly instead of erroring.
addopts = -m "not integration"

markers =
    integration: needs live credentials and/or a running Redis. Excluded by default.

asyncio_mode = strict
testpaths = tests
