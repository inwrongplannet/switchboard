services:
  gateway:
    build: .
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SWITCHBOARD_PROVIDER=${SWITCHBOARD_PROVIDER:-groq}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_TOKENS=${ADMIN_TOKENS}
      - CLIENT_TOKENS=${CLIENT_TOKENS}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SQLITE_DB_PATH=/app/data/switchboard.db
    depends_on:
      - redis
    volumes:
      - .:/app
      - switchboard-data:/app/data

  redis:
    image: redis:7-alpine
    # Deliberately NOT published to the host. The gateway reaches Redis at
    # redis:6379 over the compose network; publishing it exposed the semantic
    # cache — every prompt and every response — to anything that could route
    # to this machine. Re-adding a ports: mapping here reopens that hole;
    # scripts/verify-hardening.sh fails if you do.
    #
    # The :? form makes Compose abort with a named error rather than
    # substituting empty, which would produce `redis-server --requirepass`
    # with a missing argument and a container that exits on startup.
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required - run ./setup.sh to generate one}

  admin-ui:
    build: ./vis
    ports:
      - "${ADMIN_UI_PORT:-3000}:3000"
    environment:
      - API_URL=http://gateway:8000
    depends_on:
      - gateway

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    # Anonymous viewing is deliberately NOT enabled. Grafana is published on
    # the host, and every dashboard here reads provider names, key labels and
    # traffic volume — that is not public data. The password is generated by
    # ./setup.sh, never committed; the :? form aborts with a named error rather
    # than substituting empty, which Grafana would silently accept as "no
    # password set". scripts/verify-hardening.sh fails if either is undone.
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required - run ./setup.sh to generate one}
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  switchboard-data:
